name: Lint OpenAPI

on:
  - pull_request

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pb33f/vacuum-action@v2
        with:
          openapi_path: rfq-v1.oas.yaml
          ruleset: rulesets/oas.yaml
          fail_on_error: false
          print_logs: true
          show_rules: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.vacuum.outcome == 'failure'
        run: |
          echo "Vacuum found errors"
          exit 1