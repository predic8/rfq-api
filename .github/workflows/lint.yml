name: Lint OpenAPI

on:
  - pull_request

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pb33f/vacuum-action@v2
        with:
          openapi_path: rfq-v1.oas.yaml
          ruleset: rulesets/oas.yaml
          continue-on-error: true
          print_logs: true
          show_rules: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
