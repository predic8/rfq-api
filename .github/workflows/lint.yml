name: Lint OAS (Vacuum)

on:
  - pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pb33f/vacuum-action@v2
        with:
          openapi_path: rfq-v1.oas.yml
          github_token: ${{ secrets.GITHUB_TOKEN }}
