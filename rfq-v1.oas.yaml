openapi: '3.1.1'
info:
  title: Quotation API
  version: '1.0.0'
servers:
  - url: https://api.predic8.de/

paths:
  /rfqs:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                price:
                  type: number
                shipment:
                  type: string
                  maxLength: 10
      responses:
        '200':
          description: OK